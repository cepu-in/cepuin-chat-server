name: Deploy Cepuin Chat

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22

          script: |
            export PATH=/usr/local/go/bin:$PATH
            set -e

            echo "========================================================"
            echo "       CEPUIN CHAT GO SERVER AUTO DEPLOY"
            echo "========================================================"

            cd /var/www/cepuin_chat

            echo ""
            echo "[1/6] Pulling latest code..."
            git pull origin main

            echo ""
            echo "[2/6] Checking environment..."
            test -f .env

            echo ""
            echo "[3/6] Updating Go dependencies..."
            go mod download

            echo ""
            echo "[4/6] Building Go server..."
            mkdir -p bin
            go build -o bin/cepuin-chat ./cmd/server

            echo ""
            echo "[5/6] Restarting Cepuin Chat..."
            systemctl restart cepuin-chat

            echo ""
            echo "Waiting for server..."
            sleep 3

            echo ""
            echo "[6/6] Health check..."
            curl -f http://127.0.0.1:8081/health

            echo ""
            echo "========================================"
            echo "       DEPLOYMENT SUCCESS"
            echo "========================================"
